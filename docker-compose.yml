version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: easyfr8_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: easyfr8
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./easyfr8_admin/lib/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - easyfr8_network

  easyfr8_admin:
    build:
      context: ./easyfr8_admin
      dockerfile: Dockerfile
    container_name: easyfr8_admin
    restart: always
    env_file:
      - .env.docker
    ports:
      - "3001:3001"
    depends_on:
      - mysql
    volumes:
      - uploads_data:/app/uploads
    networks:
      - easyfr8_network

  easyfr8_user:
    build:
      context: ./easyfr8 react
      dockerfile: Dockerfile
    container_name: easyfr8_user
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - easyfr8_admin
    networks:
      - easyfr8_network

volumes:
  mysql_data:
  uploads_data:

networks:
  easyfr8_network:
    driver: bridge
